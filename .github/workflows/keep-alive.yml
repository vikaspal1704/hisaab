# Supabase pauses free projects after a week without activity. This pings the
# database twice a week so a quiet fortnight doesn't take the app offline.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_SUPABASE_URL != '' }}
    steps:
      - name: Ping database
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/rpc/me" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered HTTP $status"
